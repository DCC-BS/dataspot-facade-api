[tools]
uv = "latest"

[env]
_.file = ".env"

[tasks.dev]
description = "Run the FastAPI app with auto-reload"
run = "uv run fastapi dev ./src/dataspot_facade_api/app.py"

[tasks.auth]
description = "Authenticate and open API docs with auto-authorization"
run = "uv run python scripts/auth.py"

[tasks.check]
description = "🧪 Verify lockfile, format code, lint, and type-check"
alias = "c"
run = [
    "uv lock --locked",
    "uv run ruff format",
    "uv run ruff check --fix",
    "uv run ty check ./src/dataspot_facade_api",
]

[tasks.ci-check]
description = "🧪 Verify lockfile, format code, lint, and type-check without any file modification"
run = [
    "uv lock --locked",
    "uv run ruff format --check",
    "uv run ruff check",
    "uv run ty check ./src/dataspot_facade_api",
]

[tasks."docker:up"]
run = "docker compose up -d"

[tasks."docker:down"]
run = "docker compose down"

[tasks."docker:logs"]
run = "docker compose logs --follow"
